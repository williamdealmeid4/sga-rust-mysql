[package]
name = "sga-fbi"
version = "0.1.0"
edition = "2021"
default-run = "sga-fbi"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "json", "chrono"] }
dotenvy = "0.15"
chrono = "0.4"

[profile.release]
strip = true
